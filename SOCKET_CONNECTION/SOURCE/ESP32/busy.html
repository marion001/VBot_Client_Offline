<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>VBot Client</title>
  <style>body{background:#f6f8fb;color:#243047;font:16px/1.5 system-ui,sans-serif;padding:16px}.box{max-width:760px;margin:20px auto;padding:24px;background:white;border-radius:12px}button,a{display:inline-block;padding:10px 16px;margin:4px;border:1px solid #54739b;border-radius:6px;color:#243047;text-decoration:none;cursor:pointer}button{background:#ffe4a3}button:disabled{opacity:.5;cursor:wait}.text-success{color:#167347}.text-danger{color:#a12626}</style>
</head>
<body>
  <div class="box card shadow-sm"><div class="card-body">
    <h2 id="clientName">VBot ESP32 Client</h2>
    <p>Thiết bị đang thu hoặc phát âm thanh. Vui lòng chờ tác vụ hoàn tất rồi mở lại trang chủ.</p>
    <button id="stopAudioBtn" type="button" class="btn btn-warning me-2">Dừng âm thanh đang phát</button>
    <a class="btn btn-outline-primary" href="/">Trang chủ</a>
    <div id="stopAudioMessage" class="mt-3 small"></div>
  </div></div>
  <script>
    const stopAudioBtn=document.getElementById('stopAudioBtn'),stopAudioMessage=document.getElementById('stopAudioMessage');
    function showStopAudioMessage(text,success){stopAudioMessage.className='mt-3 small '+(success?'text-success':'text-danger');stopAudioMessage.textContent=text;}
    stopAudioBtn.addEventListener('click',async()=>{stopAudioBtn.disabled=true;showStopAudioMessage('Đang gửi lệnh dừng âm thanh...',true);try{const r=await fetch('/stop_audio',{method:'POST',cache:'no-store'});const text=await r.text();let message=text;try{const data=JSON.parse(text);message=data.message||JSON.stringify(data);}catch(_){}if(!r.ok)throw new Error(message||('HTTP '+r.status));showStopAudioMessage(message,true);}catch(err){showStopAudioMessage(String(err).replace(/^Error:\s*/,''),false);}finally{stopAudioBtn.disabled=false;}});
  </script>
</body>
</html>
